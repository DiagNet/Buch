# keep-sorted start newline_separated=yes case=no
802.1Q:
  short:
    singular: 802.1Q
  long:
    singular: IEEE 802.1Q
  description: Der gängigste Standard für das VLAN-Tagging in Ethernet-Netzwerken, der es ermöglicht, mehrere VLANs über eine einzige physische Verbindung zu übertragen.

adjazenzliste:
  short:
    singular: Adjazenzliste
  long:
    singular: Adjazenzliste
  description: >-
    Eine Darstellungsform für Graphen in der Informatik, bei der für jeden Knoten eine Liste aller seiner direkten Nachbarknoten gespeichert wird.

aetest:
  long:
    singular: AEtest
  description: Eine pyATS-Komponente zur Strukturierung und Automatisierung von Testfällen und Testabläufen.

api:
  short:
    singular: API
  long:
    singular: Application Programming Interface
  description: Eine Programmierschnittstelle, über die Softwarekomponenten miteinander kommunizieren.

as:
  short:
    singular: AS
    plural: AS
  long:
    singular: Autonomes System
    plural: Autonome Systeme
  full:
    singular: Autonomes System (AS)
    plural: Autonome Systeme (AS)
  description: Eine Sammlung von IP-Netzwerken unter der Kontrolle einer einzigen administrativen Einheit, die eine gemeinsame Routing-Politik verfolgt.

backend:
  long:
    singular: Backend
  description: Der Teil einer Anwendung, der im Hintergrund läuft und Datenverarbeitung sowie Logik bereitstellt.

bgp:
  short:
    singular: BGP
  long:
    singular: Border Gateway Protocol
  full: Border Gateway Protocol (BGP)
  description: Das Standard-Routing-Protokoll des Internets, das den Datenaustausch zwischen verschiedenen Autonomen Systemen (AS) steuert.

cd:
  short:
    singular: CD
  long:
    singular: Continuous Deployment
  description: Die automatisierte Bereitstellung von Software in Produktionsumgebungen nach erfolgreicher Integration.

ci:
  short:
    singular: CI
  long:
    singular: Continuous Integration
  description: Die Praxis der regelmäßigen Integration von Code-Änderungen in ein gemeinsames Repository mit automatisierten Regressionstests.

diagnet:
  short:
    singular: DiagNet
  long:
    singular: DiagNet
  description: Der Name des in dieser Arbeit entwickelten Systems. Eine Webapplikation zur automatisierten Durchführung, Verwaltung und Analyse von Netzwerktests.

direnv:
  long:
    singular: "`direnv`"
  description: Eine Shell-Erweiterung, die Umgebungsvariablen automatisch lädt, sobald ein Verzeichnis betreten wird.

djlint:
  long:
    singular: djLint
  description: Ein Linter und Formatter speziell für HTML-Templates, der häufig in Django- oder Jinja2-Projekten Anwendung findet.

dmvpn:
  short:
    singular: DMVPN
  long:
    singular: Dynamic Multipoint Virtual Private Network
  full: Dynamic Multipoint Virtual Private Network (DMVPN)
  description: Eine VPN-Technologie, die den dynamischen Aufbau von IPsec-Tunneln zwischen mehreren Standorten ohne permanente Konfiguration ermöglicht.

ebgp:
  short:
    singular: eBGP
  long:
    singular: External Border Gateway Protocol
  full: External Border Gateway Protocol (eBGP)
  description: Eine Variante des Border Gateway Protocols, die für den Austausch von Routing-Informationen zwischen unterschiedlichen Autonomen Systemen (AS) verwendet wird.

eigrp:
  short:
    singular: EIGRP
  long:
    singular: Enhanced Interior Gateway Routing Protocol
  full: Enhanced Interior Gateway Routing Protocol (EIGRP)
  description: Ein fortschrittliches Distanzvektor-Routing-Protokoll von Cisco, das Bandbreite und Verzögerung zur Pfadberechnung kombiniert.

exception:
  long:
    singular: Exception
  description: Ein Fehler oder Ausnahmezustand, der während der Programmausführung auftritt.

fabrikmethode:
  short:
    singular: Fabrikmethode
  long:
    singular: Fabrikmethode
  full: Fabrikmethode
  description: >-
    Ein softwaretechnisches Entwurfsmuster, das eine Schnittstelle zur Erzeugung von Objekten definiert, wobei die konkrete Instanziierung den Unterklassen überlassen wird.

fhrp:
  short:
    singular: FHRP
    plural: FHRPs
  long:
    singular: First Hop Redundancy Protocol
    plural: First Hop Redundancy Protocols
  full:
    singular: First Hop Redundancy Protocol (FHRP)
    plural: First Hop Redundancy Protocols (FHRPs)
  description: Ein Oberbegriff für Protokolle (wie HSRP, VRRP, GLBP), die Gateway-Redundanz in lokalen Netzwerken bereitstellen.

framework:
  long:
    singular: Framework
  description: Eine Sammlung von Bibliotheken und Werkzeugen, die eine Grundlage für die Entwicklung von Softwareanwendungen bereitstellt.

genie:
  long:
    singular: Genie
  description: Eine Bibliothek innerhalb von pyATS, die Parser und Funktionen zur strukturierten Auswertung von Geräteinformationen bereitstellt.

glbp:
  short:
    singular: GLBP
  long:
    singular: Gateway Load Balancing Protocol
  full: Gateway Load Balancing Protocol (GLBP)
  description: Ein Cisco-Protokoll zur Gateway-Redundanz, das zusätzlich zur Ausfallsicherheit eine Lastverteilung über mehrere Router hinweg bietet.

gns3:
  short:
    singular: GNS3
  long:
    singular: Graphical Network Simulator 3
  description: Eine Software zur Simulation komplexer Netzwerke, die es ermöglicht, virtuelle und reale Geräte miteinander zu verknüpfen.

gre:
  short:
    singular: GRE
  long:
    singular: Generic Routing Encapsulation
  full: Generic Routing Encapsulation (GRE)
  description: Ein Tunneling-Protokoll, das beliebige Netzwerkprotokolle in IP-Pakete verpackt, um sie über ein öffentliches Netzwerk zu transportieren.

gui:
  short:
    singular: GUI
  long:
    singular: Graphical User Interface
  description: Bezeichnet eine Benutzeroberfläche, die dem Anwender die Interaktion mit der Software durch visuelle Elemente wie Fenster, Menüs und Symbole ermöglicht, anstatt textbasierte Befehle zu erfordern.

hermetic:
  long:
    singular: hermetisch
    plural: hermetische
  description: Beschreibt in Build-Systemen eine Umgebung, die vollständig isoliert ist und keinen Zugriff auf das Dateisystem oder Netzwerk des Host-Computers hat, außer explizit deklarierte Eingaben.

hsrp:
  short:
    singular: HSRP
  long:
    singular: Hot Standby Router Protocol
  full: Hot Standby Router Protocol (HSRP)
  description: Ein proprietäres Redundanzprotokoll von Cisco, das durch ein Active/Standby-Modell die Ausfallsicherheit des Standard-Gateways gewährleistet.

html:
  short:
    singular: HTML
  long:
    singular: Hypertext Markup Language
  description: >-
    Eine strukturierte Auszeichnungssprache, die zur Erstellung und Gestaltung digitaler Dokumente im World Wide Web dient.

icmp:
  short:
    singular: ICMP
  long:
    singular: Internet Control Message Protocol
  full: Internet Control Message Protocol
  description: >-
    Ein Netzwerkprotokoll, das zum Austausch von Informations- und Fehlermeldungen in IP-Netzwerken dient. Es wird primär für Diagnosezwecke verwendet, etwa um die Erreichbarkeit von Hosts zu prüfen.

igp:
  short:
    singular: IGP
    plural: IGPs
  long:
    singular: Interior Gateway Protocol
    plural: Interior Gateway Protocols
  full:
    singular: Interior Gateway Protocol (IGP)
    plural: Interior Gateway Protocols (IGPs)
  description: Ein Routing-Protokoll, das zum Austausch von Routing-Informationen zwischen Gateways (Routern) innerhalb eines einzelnen Autonomen Systems (AS) verwendet wird.

instanzattribute:
  short:
    singular: Instanzattribute
  long:
    singular: Instanzattribute
  description: >-
    Variablen, die an eine spezifische Instanz einer Klasse gebunden sind und deren individuellen Zustand speichern.

interface:
  long:
    singular: Netzwerkinterface
  description: Eine physische oder logische Schnittstelle eines Netzwerkgeräts zur Datenübertragung.

ipsec:
  short:
    singular: IPsec
  long:
    singular: Internet Protocol Security
  full: Internet Protocol Security (IPsec)
  description: Eine Protokoll-Suite zur Sicherung der Internetkommunikation durch Authentifizierung und Verschlüsselung jedes IP-Pakets.

ise:
  short:
    singular: ISE
  long:
    singular: Identity Services Engine
  description: Eine Sicherheitsplattform von Cisco zur Identitätsverwaltung und Zugriffskontrolle, die Richtlinien für den Netzwerkzugriff zentral steuert.

json:
  short:
    singular: JSON
  long:
    singular: JavaScript Object Notation
  full: JavaScript Object Notation
  description: >-
    Ein textbasiertes Format zum effizienten Datenaustausch zwischen Anwendungen, das in Web-APIs als Standard für die Client-Server-Kommunikation dient.

just:
  long:
    singular: "`just`"
  description: Ein Task-Runner, der Projektaufgaben in einem Justfile definiert und als moderne Alternative zu `make` dient.

med:
  short:
    singular: MED
  long:
    singular: Multi-Exit Discriminator
  full: Multi-Exit Discriminator (MED)
  description: Ein optionales BGP-Pfadattribut, das verwendet wird, um den eingehenden Datenverkehr von einem benachbarten Autonomen System zu steuern.

mpls:
  short:
    singular: MPLS
  long:
    singular: Multiprotocol Label Switching
  full: Multiprotocol Label Switching (MPLS)
  description: Ein Verfahren zur Weiterleitung von Datenpaketen entlang vordefinierter Pfade basierend auf kurzen Labels statt langer Netzwerkadressen.

nat:
  short:
    singular: NAT
  long:
    singular: Network Address Translation
  description: Ein Verfahren, bei dem IP-Adressen in Datenpaketen durch andere Adressen ersetzt werden, um die Kommunikation zwischen privaten und öffentlichen Netzwerken zu ermöglichen.

neighbor:
  long:
    singular: Neighbor
  description: Ein benachbartes Netzwerkgerät, mit dem Routing-Informationen ausgetauscht werden.

nhrp:
  short:
    singular: NHRP
    plural: NHRPs
  long:
    singular: Next Hop Resolution Protocol
    plural: Next Hop Resolution Protocols
  full:
    singular: Next Hop Resolution Protocol (NHRP)
    plural: Next Hop Resolution Protocols (NHRPs)
  description: Ein Protokoll, das in NBMA-Netzwerken (wie DMVPN) verwendet wird, um die logische IP-Adresse eines Ziels auf die physische Tunnel-Endpunkt-Adresse aufzulösen.

nix:
  long:
    singular: Nix
  description: Ein rein funktionaler Paketmanager und Build-System, das Software in isolierten, unveränderlichen Zuständen verwaltet.

nix-flakes:
  long:
    singular: Nix Flakes
  description: Eine Erweiterung des Nix-Ökosystems zur hermetischen Abriegelung von Projekt-Abhängigkeiten mittels `flake.nix`.

nix-shell:
  long:
    singular: Nix Shell
  description: Eine temporäre, isolierte Entwicklungsumgebung, in der alle definierten Abhängigkeiten verfügbar sind, ohne das Host-System zu verändern.

nixfmt:
  long:
    singular: nixfmt
  description: Ein Formatter für Nix-Code, der sicherstellt, dass alle `.nix`-Konfigurationsdateien einem Standardstil folgen.

ospf:
  short:
    singular: OSPF
  long:
    singular: Open Shortest Path First
  description: Ein dynamisches Routing-Protokoll zur Berechnung des kürzesten Pfades innerhalb eines IP-Netzwerks.

ospf_area:
  long:
    singular: OSPF Area
  description: Ein logischer Bereich innerhalb eines OSPF-Netzwerks zur Strukturierung und Skalierung.

parser:
  long:
    singular: Parser
  description: Eine Softwarekomponente, die unstrukturierten Text, wie Geräteausgaben, in strukturierte Datenformate umwandelt.

pat:
  short:
    singular: PAT
    plural: PATs
  long:
    singular: Port Address Translation
    plural: Port Address Translations
  full:
    singular: Port Address Translation (PAT)
    plural: Port Address Translations (PATs)
  description: Eine Erweiterung von NAT, die es ermöglicht, mehrere Geräte im lokalen Netzwerk über eine einzige öffentliche IP-Adresse abzubilden, indem unterschiedliche Source-Ports verwendet werden.

prettier:
  long:
    singular: Prettier
  description: Ein "opinionated" Code-Formatter, der vorrangig für Web-Technologien (JavaScript, CSS, HTML, JSON) eingesetzt wird, um einen einheitlichen Stil zu erzwingen.

pyats:
  long:
    singular: pyATS
  description: Ein von Cisco entwickeltes Python-basiertes Framework zur Automatisierung und zum Testen von Netzwerkgeräten.

python_dictionary:
  long:
    singular: Python-Dictionary
  description: Eine Datenstruktur in Python zur Speicherung von Schlüssel-Wert-Paaren.

rip:
  short:
    singular: RIP
  long:
    singular: Routing Information Protocol
  full: Routing Information Protocol (RIP)
  description: Ein klassisches Distanzvektor-Routing-Protokoll, das den Hop-Count zur Bestimmung des besten Pfades verwendet.

router_id:
  long:
    singular: Router ID
  description: Eine eindeutige Kennung eines Routers innerhalb eines Routing-Protokolls.

routingprotokoll:
  long:
    singular: Routing-Protokoll
  description: Ein Protokoll, das den Austausch von Routing-Informationen zwischen Netzwerkgeräten ermöglicht.

ruff:
  long:
    singular: Ruff
  description: Ein extrem schneller Python-Linter und Code-Formatter, geschrieben in Rust, der mehrere klassische Tools (Flake8, Black, isort) ersetzt.

ssh:
  short:
    singular: SSH
  long:
    singular: Secure Shell
  description: Ein verschlüsseltes Netzwerkprotokoll für den sicheren Fernzugriff auf Geräte.

telnet:
  long:
    singular: Telnet
  description: Ein unverschlüsseltes Netzwerkprotokoll für den fernzugriff auf Geräte.

testbed:
  long:
    singular: Testbed
  description: Eine Konfigurationsdatei in pyATS, welche Geräte, Zugangsdaten und Verbindungsparameter für automatisierte Tests definiert.

treefmt:
  long:
    singular: Treefmt
  description: Ein Werkzeug zur Orchestrierung verschiedener Code-Formatierer (z. B. Ruff, Prettier) für eine einheitliche Codebasis.

trunk:
  short:
    singular: Trunk
  long:
    singular: Trunk
  description: Eine Punkt-zu-Punkt-Verbindung zwischen zwei Netzwerkgeräten (z. B. Switchen), die den Datenverkehr für mehrere VLANs gleichzeitig über ein einziges physisches Kabel überträgt.

twelvefactor:
  long:
    singular: The Twelve-Factor App
  description: Eine Methodik zur Erstellung skalierbarer und wartbarer Software-as-a-Service-Anwendungen.

unicon:
  long:
    singular: Unicon
  description: Eine Bibliothek innerhalb von pyATS, die Geräteverbindungen über Protokolle wie SSH oder Telnet verwaltet.

uv:
  long:
    singular: "`uv`"
  description: Ein extrem performanter Python-Paketmanager und Resolver, geschrieben in Rust, der `pip` und `venv` ersetzt.

vlan:
  short:
    singular: vlan
  long:
    singular: Virtual Local Area Network
  description: Ein logisches Teilnetz innerhalb eines physischen Netzwerks, das Geräte unabhängig von ihrem Standort isoliert.

wan:
  short:
    singular: WAN
  long:
    singular: Wide Area Network
  description: Ein Rechnernetz, das sich über einen sehr großen geografischen Bereich erstreckt und verschiedene lokale Netze (LANs) miteinander verbindet.

yaml:
  short:
    singular: YAML
  long:
    singular: YAML Ain't Markup Language
  description: Ein menschenlesbares Datenformat zur Speicherung strukturierter Konfigurationsdaten.
# keep-sorted end
